name: Build Columbina DroidSpaces Kernel for Galaxy Z Flip3 (b2q)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Git Repository'
        required: true
        default: 'https://github.com/AlexFurina/android_kernel_samsung_sm8350'
      kernel_branch:
        description: 'Kernel Source Branch to fetch'
        required: true
        default: 'Flip3-Android16'
      kernel_commit:
        description: 'Commit SHA to checkout (Default: Option 1 commit 9e6bd77c)'
        required: false
        default: '9e6bd77c825e1c7c025b18584f6c8acd660ea155'
      defconfig_target:
        description: 'Target Defconfig'
        required: true
        default: 'vendor/b2q_kor_singlex_defconfig'
      localversion:
        description: 'Kernel LOCALVERSION suffix'
        required: true
        default: '-Columbina-Droidspaces'
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - 'config/**'
      - 'anykernel/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Kernel & Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Helper Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi git libelf-dev libncurses-dev libssl-dev \
            libyaml-dev lz4 make python3 python3-pip tar xz-utils zip

      - name: Setup Neutron Clang 18 Toolchain (Pinned 03062026)
        run: |
          mkdir -p clang
          cd clang
          # Fetch antman with fail-safe curl
          curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          # Pin to 03 June 2026 release (matches Columbina #1 build date)
          ./antman -S=03062026
          ./antman --patch=glibc
          
          # Add to PATH and assert compiler is functional
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Clone Samsung SM8350 Kernel Source
        run: |
          REPO_URL="${{ github.event.inputs.kernel_repo || 'https://github.com/AlexFurina/android_kernel_samsung_sm8350' }}"
          BRANCH="${{ github.event.inputs.kernel_branch || 'Flip3-Android16' }}"
          COMMIT="${{ github.event.inputs.kernel_commit || '9e6bd77c825e1c7c025b18584f6c8acd660ea155' }}"
          
          echo "Cloning ${REPO_URL} branch ${BRANCH}..."
          git clone --single-branch --branch "${BRANCH}" "${REPO_URL}" kernel_src
          cd kernel_src
          
          if [ -n "${COMMIT}" ]; then
            echo "Checking out target commit ${COMMIT}..."
            git checkout "${COMMIT}"
          fi
          echo "Kernel checked out at: $(git log -1 --oneline)"

      - name: Apply DroidSpaces kABI Patches (with guard)
        run: |
          cd kernel_src
          
          apply_kabi_patch() {
            local patch_path="$1"
            local patch_name
            patch_name="$(basename "$patch_path")"
            
            if git apply --check "$patch_path" >/dev/null 2>&1; then
              echo "Applying ${patch_name}..."
              git apply --verbose --3way "$patch_path"
            elif git apply --reverse --check "$patch_path" >/dev/null 2>&1; then
              echo "Notice: ${patch_name} is already present in source tree, skipping."
            else
              echo "Applying ${patch_name} with 3-way merge fallback..."
              git apply --verbose --3way "$patch_path" || echo "Warning: skipped ${patch_name}"
            fi
          }
          
          apply_kabi_patch "../patches/001-fix-sysvipc-kabi.patch"
          apply_kabi_patch "../patches/002-fix-posix-mqueue-kabi.patch"
          echo "Patching completed."

      - name: Configure Kernel with DroidSpaces Defconfig Fragment
        run: |
          cd kernel_src
          DEFCONFIG_TARGET="${{ github.event.inputs.defconfig_target || 'vendor/b2q_kor_singlex_defconfig' }}"
          LOCALVERSION_VAL="${{ github.event.inputs.localversion || '-Columbina-Droidspaces' }}"
          
          mkdir -p out
          
          # Generate base defconfig
          if [ -f "arch/arm64/configs/${DEFCONFIG_TARGET}" ]; then
            make O=out ARCH=arm64 "${DEFCONFIG_TARGET}"
          elif [ -f "arch/arm64/configs/vendor/${DEFCONFIG_TARGET}" ]; then
            make O=out ARCH=arm64 "vendor/${DEFCONFIG_TARGET}"
          else
            make O=out ARCH=arm64 "${DEFCONFIG_TARGET}"
          fi
          
          # Append DroidSpaces config fragment
          echo "Appending DroidSpaces configuration fragment..."
          cat ../config/droidspaces.config >> out/.config
          
          # Set localversion (replace or append fallback)
          if grep -q "^CONFIG_LOCALVERSION=" out/.config; then
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${LOCALVERSION_VAL}\"|" out/.config
          else
            echo "CONFIG_LOCALVERSION=\"${LOCALVERSION_VAL}\"" >> out/.config
          fi
          
          # Resolve configuration dependencies
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig
          
          # Assert critical DroidSpaces configs are explicitly enabled (=y)
          echo "Asserting critical DroidSpaces configurations..."
          CRITICAL_CONFIGS=(
            "CONFIG_SYSVIPC"
            "CONFIG_POSIX_MQUEUE"
            "CONFIG_NAMESPACES"
            "CONFIG_PID_NS"
            "CONFIG_IPC_NS"
            "CONFIG_USER_NS"
            "CONFIG_DEVTMPFS"
            "CONFIG_OVERLAY_FS"
            "CONFIG_NET_NS"
            "CONFIG_VETH"
            "CONFIG_BRIDGE"
          )
          for cfg in "${CRITICAL_CONFIGS[@]}"; do
            if grep -q "^${cfg}=y" out/.config; then
              echo "  [OK] ${cfg}=y"
            else
              echo "  [FAIL] ${cfg} is NOT enabled in out/.config!"
              exit 1
            fi
          done

      - name: Compile Kernel Image
        run: |
          cd kernel_src
          
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Compile Image with full toolchain parameters
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) Image
          
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel Image compiled successfully!"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "Error: Image not found after compilation!"
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          mkdir -p package_ak3
          cd package_ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git .
          rm -rf .git
          
          # Copy custom anykernel.sh for b2q
          cp ../anykernel/anykernel.sh .
          
          # Copy compiled Image
          cp ../kernel_src/out/arch/arm64/boot/Image .
          
          # Build AnyKernel3 zip
          zip -r9 ../Columbina-Droidspaces-b2q-AnyKernel3.zip * -x README.md *placeholder
          cd ..
          ls -lh Columbina-Droidspaces-b2q-AnyKernel3.zip

      - name: Repack Boot Image (if base boot.img exists)
        run: |
          if [ -f "default/boot.img" ]; then
            echo "Repacking default/boot.img with new kernel Image..."
            python3 scripts/repack_bootimg.py \
              default/boot.img \
              kernel_src/out/arch/arm64/boot/Image \
              Columbina-Droidspaces-b2q-boot.img
            ls -lh Columbina-Droidspaces-b2q-boot.img
          else
            echo "default/boot.img not found, skipping direct boot.img repack."
          fi

      - name: Upload AnyKernel3 & Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Columbina-Droidspaces-ZFlip3-AnyKernel3
          path: |
            Columbina-Droidspaces-b2q-AnyKernel3.zip
            kernel_src/out/arch/arm64/boot/Image
            kernel_src/out/.config
          if-no-files-found: error

      - name: Upload Repacked Boot Image (if generated)
        if: hashFiles('Columbina-Droidspaces-b2q-boot.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Columbina-Droidspaces-ZFlip3-boot.img
          path: Columbina-Droidspaces-b2q-boot.img
